<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f3ee">
<title>Tic Tac Toe — Play with a friend</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="social.js"></script>
<style>
  :root {
    --bg: #f6f3ee;
    --card: #ffffff;
    --ink: #1b1a17;
    --muted: #5f5b53;
    --line: #d9d3c7;
    --x: #c4471f;
    --o: #1f5fc4;
    --win: #fbe7a1;
    --btn: #1b1a17;
    --btn-ink: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151412;
      --card: #1f1e1b;
      --ink: #f2efe8;
      --muted: #aaa49a;
      --line: #3a3833;
      --x: #ff7a52;
      --o: #6aa2ff;
      --win: #4a3f12;
      --btn: #f2efe8;
      --btn-ink: #151412;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    display: flex;
    justify-content: center;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  }
  main { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 18px; }
  h1 { margin: 8px 0 0; font-size: 34px; letter-spacing: -0.5px; line-height: 1.05; }
  h1 .x { color: var(--x); } h1 .o { color: var(--o); }
  p.sub { margin: 0; color: var(--muted); font-size: 15px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  button, .btn {
    font: inherit; font-weight: 700; font-size: 16px;
    min-height: 48px; border-radius: 12px; border: 2px solid var(--btn);
    background: var(--btn); color: var(--btn-ink); cursor: pointer; padding: 0 16px;
  }
  button.ghost { background: transparent; color: var(--ink); }
  button:disabled { opacity: .45; cursor: default; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  label { font-size: 14px; color: var(--muted); }
  input {
    font: inherit; font-size: 22px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase;
    min-height: 48px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); color: var(--ink);
    padding: 0 14px; width: 100%;
  }
  input:focus { outline: none; border-color: var(--ink); }
  .divider { text-align: center; color: var(--muted); font-size: 13px; }
  .code { font-size: 40px; font-weight: 700; letter-spacing: 8px; text-align: center; }
  .status { min-height: 24px; font-size: 17px; font-weight: 700; text-align: center; }
  .note { font-size: 13px; color: var(--muted); text-align: center; margin: 0; }
  .hidden { display: none !important; }

  .scores { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
  .pl { display: flex; flex-direction: column; align-items: center; padding: 8px; border-radius: 12px; border: 2px solid transparent; }
  .pl.turn { border-color: var(--line); background: var(--bg); }
  .pl .mark { font-size: 26px; font-weight: 700; }
  .pl .who { font-size: 13px; color: var(--muted); }
  .pl .pts { font-size: 22px; font-weight: 700; }
  .draws { font-size: 13px; color: var(--muted); text-align: center; }

  .board {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    width: 100%; aspect-ratio: 1; background: var(--line); border-radius: 16px; padding: 8px;
  }
  .cell {
    background: var(--card); border: 0; border-radius: 10px; min-height: 0; padding: 0;
    font-size: clamp(48px, 18vw, 84px); font-weight: 700; line-height: 1;
    display: flex; align-items: center; justify-content: center; color: var(--ink);
  }
  .cell.X { color: var(--x); } .cell.O { color: var(--o); }
  .cell.win { background: var(--win); }
  .cell:disabled { opacity: 1; }
  .cell.pop { animation: pop .18s ease-out; }
  @keyframes pop { from { transform: scale(.6); } to { transform: scale(1); } }
</style>
</head>
<body>
<main>
  <header>
    <a href="./" style="color:var(--muted);font-size:14px;display:inline-block;padding:8px 0">← All games</a>
    <h1>Tic <span class="x">Tac</span> <span class="o">Toe</span></h1>
    <p class="sub">Two players, two phones, no sign-up.</p>
  </header>

  <!-- LOBBY -->
  <section id="lobby" class="card">
    <div id="profileSlot"></div>
    <button id="createBtn">Create a game</button>
    <div class="divider">or join a friend's game</div>
    <label for="codeInput">Room code</label>
    <input id="codeInput" maxlength="5" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCDE">
    <button id="joinBtn" class="ghost">Join</button>
    <div class="divider">or</div>
    <button id="localBtn" class="ghost">Play on this device</button>
    <p id="lobbyMsg" class="note"></p>
  </section>

  <!-- WAITING -->
  <section id="waiting" class="card hidden">
    <p class="note">Share this code with your friend</p>
    <div id="roomCode" class="code">-----</div>
    <div class="row">
      <button id="shareBtn">Share link</button>
      <button id="copyBtn" class="ghost">Copy link</button>
    </div>
    <div id="waitMsg" class="status">Waiting for your friend…</div>
    <button id="cancelBtn" class="ghost">Cancel</button>
  </section>

  <!-- GAME -->
  <section id="game" class="card hidden">
    <div class="scores">
      <div id="plX" class="pl"><span class="mark" style="color:var(--x)">X</span><span id="whoX" class="who">You</span><span id="ptsX" class="pts">0</span></div>
      <div class="draws">Draws<br><strong id="ptsD">0</strong></div>
      <div id="plO" class="pl"><span class="mark" style="color:var(--o)">O</span><span id="whoO" class="who">Friend</span><span id="ptsO" class="pts">0</span></div>
    </div>
    <div id="status" class="status">&nbsp;</div>
    <div id="board" class="board" role="grid" aria-label="Tic tac toe board"></div>
    <div class="row">
      <button id="againBtn" class="hidden">Play again</button>
      <button id="leaveBtn" class="ghost">Leave</button>
    </div>
    <p id="gameNote" class="note"></p>
  </section>
</main>

<script>
(() => {
  const PREFIX = 'tttgame-v1-';           // keeps room ids unique on the public broker
  const ALPHA = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

  const $ = id => document.getElementById(id);
  const show = id => ['lobby','waiting','game'].forEach(s => $(s).classList.toggle('hidden', s !== id));

  let peer = null, conn = null;
  let mode = null;          // 'host' | 'guest' | 'local'
  let me = 'X';
  let board, turn, round = 0, over = false, winLine = null;
  let scores = { X: 0, O: 0, D: 0 };

  // ---------- board ----------
  const cells = [];
  for (let i = 0; i < 9; i++) {
    const b = document.createElement('button');
    b.className = 'cell';
    b.setAttribute('aria-label', 'Square ' + (i + 1));
    b.addEventListener('click', () => onCellClick(i));
    $('board').appendChild(b);
    cells.push(b);
  }

  function newRound(r) {
    round = r;
    board = Array(9).fill(null);
    turn = round % 2 === 0 ? 'X' : 'O';   // starter alternates each round
    over = false; winLine = null;
    cells.forEach(c => { c.textContent = ''; c.className = 'cell'; });
    $('againBtn').classList.add('hidden');
    render();
  }

  function winner() {
    for (const l of LINES) {
      const [a,b,c] = l;
      if (board[a] && board[a] === board[b] && board[a] === board[c]) return { w: board[a], line: l };
    }
    if (board.every(Boolean)) return { w: 'D' };
    return null;
  }

  function place(i, mark) {
    if (over || board[i] || mark !== turn) return false;
    board[i] = mark;
    cells[i].textContent = mark;
    cells[i].classList.add(mark, 'pop');
    if (navigator.vibrate) navigator.vibrate(15);
    const res = winner();
    if (res) {
      over = true;
      scores[res.w]++;
      winLine = res.line || null;
      if (winLine) winLine.forEach(k => cells[k].classList.add('win'));
      $('againBtn').classList.remove('hidden');
    } else {
      turn = turn === 'X' ? 'O' : 'X';
    }
    render(res);
    return true;
  }

  function onCellClick(i) {
    if (mode === 'local') { place(i, turn); return; }
    if (!conn || !conn.open) return;
    if (turn !== me) return;
    if (place(i, me)) send({ t: 'move', i });
  }

  function render(res) {
    const local = mode === 'local';
    $('whoX').textContent = local ? 'Player 1' : (me === 'X' ? 'You' : ON());
    $('whoO').textContent = local ? 'Player 2' : (me === 'O' ? 'You' : ON());
    $('ptsX').textContent = scores.X; $('ptsO').textContent = scores.O; $('ptsD').textContent = scores.D;
    $('plX').classList.toggle('turn', !over && turn === 'X');
    $('plO').classList.toggle('turn', !over && turn === 'O');

    let s;
    if (over) {
      const w = res ? res.w : (winLine ? board[winLine[0]] : 'D');
      if (w === 'D') s = "It's a draw";
      else if (local) s = (w === 'X' ? 'Player 1' : 'Player 2') + ' wins!';
      else s = w === me ? 'You win!' : ON() + ' wins';
    } else if (local) {
      s = (turn === 'X' ? 'Player 1 (X)' : 'Player 2 (O)') + ' to move';
    } else {
      s = turn === me ? 'Your turn' : ON() + "'s turn…";
    }
    $('status').textContent = s;

    const myMove = local || (turn === me && conn && conn.open);
    cells.forEach((c, i) => { c.disabled = over || !!board[i] || !myMove; });
  }

  // ---------- networking ----------
  function send(msg) { if (conn && conn.open) conn.send(msg); }

  function makeCode() {
    let s = '';
    const arr = crypto.getRandomValues(new Uint8Array(5));
    for (const n of arr) s += ALPHA[n % ALPHA.length];
    return s;
  }

  function shareUrl(code) {
    const u = new URL(location.href);
    u.search = '?room=' + code; u.hash = '';
    return u.toString();
  }

  // ---------- chat, reactions & names (shared social.js) ----------
  const ON = () => Social.oppName();
  Social.profilePicker($('profileSlot'));
  Social.init({
    send: m => send(m), shakeEl: document.querySelector('main'), anchorFor: () => (me === 'X' ? $('plO') : $('plX')),
    onPeer: () => { try { if (mode === 'host' || mode === 'guest') render(); } catch (e) {} }
  });

  function cleanup() {
    Social.show(false);
    try { conn && conn.close(); } catch (e) {}
    try { peer && peer.destroy(); } catch (e) {}
    conn = null; peer = null; mode = null;
    history.replaceState(null, '', location.pathname);
  }

  function goLobby(msg) {
    cleanup();
    $('lobbyMsg').textContent = msg || '';
    show('lobby');
  }

  function host() {
    mode = 'host'; me = 'X';
    const code = makeCode();
    $('roomCode').textContent = code;
    $('waitMsg').textContent = 'Connecting…';
    show('waiting');

    peer = new Peer(PREFIX + code);
    peer.on('open', () => { $('waitMsg').textContent = 'Waiting for your friend…'; });
    peer.on('connection', c => {
      if (conn && conn.open) { c.on('open', () => { c.send({ t: 'full' }); setTimeout(() => c.close(), 300); }); return; }
      wire(c);
    });
    peer.on('disconnected', () => { if (peer && !peer.destroyed) peer.reconnect(); });
    peer.on('error', err => {
      if (err.type === 'unavailable-id') { cleanup(); host(); return; }
      if (err.type === 'network' || err.type === 'server-error') goLobby("Couldn't reach the connection service. Check your internet and try again.");
      else if (!conn || !conn.open) $('waitMsg').textContent = 'Connection problem: ' + err.type;
    });
  }

  function join(code) {
    code = (code || '').trim().toUpperCase();
    if (code.length !== 5) { $('lobbyMsg').textContent = 'Enter the 5-letter room code.'; return; }
    mode = 'guest'; me = 'O';
    $('lobbyMsg').textContent = 'Joining ' + code + '…';
    peer = new Peer();
    peer.on('open', () => {
      const c = peer.connect(PREFIX + code, { reliable: true });
      wire(c);
      setTimeout(() => { if (mode === 'guest' && (!conn || !conn.open)) goLobby('No game found with code ' + code + '. Ask your friend for a fresh code.'); }, 12000);
    });
    peer.on('error', err => {
      if (err.type === 'peer-unavailable') goLobby('No game found with code ' + code + '. Ask your friend for a fresh code.');
      else if (err.type === 'network' || err.type === 'server-error') goLobby("Couldn't reach the connection service. Check your internet and try again.");
      else goLobby('Connection problem: ' + err.type);
    });
  }

  function wire(c) {
    conn = c;
    c.on('open', () => {
      Social.reset('Chat with your friend while you play.'); Social.show(true); Social.hello();
      history.replaceState(null, '', location.pathname);
      scores = { X: 0, O: 0, D: 0 };
      if (mode === 'host') send({ t: 'start', round: 0 });
      newRound(0);
      $('gameNote').textContent = 'You are ' + me + '. ' + (me === 'X' ? 'You go first.' : ON() + ' goes first.');
      show('game');
    });
    c.on('data', msg => {
      if (!msg || typeof msg !== 'object') return;
      if (Social.handle(msg)) return;
      if (msg.t === 'full') { goLobby('That game already has two players.'); return; }
      if (msg.t === 'start') { newRound(msg.round | 0); return; }
      if (msg.t === 'move') {
        const i = msg.i | 0;
        const them = me === 'X' ? 'O' : 'X';
        if (i >= 0 && i < 9) place(i, them);
        return;
      }
      if (msg.t === 'again') { newRound(msg.round | 0); $('gameNote').textContent = (turn === me ? 'You start' : ON() + ' starts') + ' this round.'; return; }
      if (msg.t === 'bye') { goLobby(ON() + ' left the game.'); }
    });
    c.on('close', () => { if (mode === 'host' || mode === 'guest') goLobby('Connection lost. Start a new game to play again.'); });
    c.on('error', () => {});
  }

  // ---------- buttons ----------
  $('createBtn').onclick = () => { $('lobbyMsg').textContent = ''; host(); };
  $('joinBtn').onclick = () => join($('codeInput').value);
  $('codeInput').addEventListener('keydown', e => { if (e.key === 'Enter') join($('codeInput').value); });
  $('codeInput').addEventListener('input', e => { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); });

  $('localBtn').onclick = () => {
    mode = 'local'; scores = { X: 0, O: 0, D: 0 };
    newRound(0);
    $('gameNote').textContent = 'Pass the phone after each move.';
    show('game');
  };

  $('shareBtn').onclick = async () => {
    const url = shareUrl($('roomCode').textContent);
    if (navigator.share) {
      try { await navigator.share({ title: 'Tic Tac Toe', text: 'Play tic tac toe with me! Code: ' + $('roomCode').textContent, url }); } catch (e) {}
    } else { copy(url); }
  };
  $('copyBtn').onclick = () => copy(shareUrl($('roomCode').textContent));
  function copy(text) {
    const done = () => { $('copyBtn').textContent = 'Copied!'; setTimeout(() => $('copyBtn').textContent = 'Copy link', 1500); };
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, () => prompt('Copy this link:', text));
    else prompt('Copy this link:', text);
  }
  $('cancelBtn').onclick = () => goLobby();

  $('againBtn').onclick = () => {
    const r = round + 1;
    if (mode === 'local') { newRound(r); return; }
    send({ t: 'again', round: r });
    newRound(r);
    $('gameNote').textContent = (turn === me ? 'You start' : ON() + ' starts') + ' this round.';
  };
  $('leaveBtn').onclick = () => { send({ t: 'bye' }); setTimeout(() => goLobby(), 150); };

  window.addEventListener('beforeunload', () => send({ t: 'bye' }));

  // ---------- start ----------
  if (typeof Peer === 'undefined') {
    $('createBtn').disabled = true; $('joinBtn').disabled = true;
    $('lobbyMsg').textContent = 'Online play could not load. You can still play on this device.';
  }
  const roomParam = new URLSearchParams(location.search).get('room');
  if (roomParam && typeof Peer !== 'undefined') { $('codeInput').value = roomParam.toUpperCase(); join(roomParam); }
})();
</script>
</body>
</html>
